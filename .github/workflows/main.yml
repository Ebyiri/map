name: Build EXE

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - name: Install dependencies
      run: |
        pip install pyinstaller folium shapely beautifulsoup4 lxml
    - name: Build with PyInstaller
      run: |
        pyinstaller --onefile map_script.py
    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: DubaiMapExecutable
        path: dist/map_script.exe